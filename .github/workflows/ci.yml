name: CI Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 18 * * 0' # Monday 02:23 Asia/Shanghai: full UI matrix
  workflow_dispatch:
    inputs:
      full_ui_matrix:
        description: Run all viewport/theme combinations
        type: boolean
        default: true
      ui_title_filter:
        description: Optional Playwright title filter for a manual targeted UI check
        type: string
        default: ''

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          services/*/package-lock.json

    - name: Select auxiliary PR checks
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: node scripts/ci/pr-scope.mjs

    - name: Use Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          services/workflow-service/requirements.txt
          services/ai-omni-service/requirements.txt
          integration_tests/requirements.txt

    - name: Install dependencies
      run: npm ci

    - name: Install client dependencies
      run: |
        cd client
        npm ci --legacy-peer-deps

    - name: Install service dependencies
      run: |
        cd services/user-service
        npm ci
        cd ../comms-service
        npm ci
        cd ../history-analytics-service
        npm ci
        cd ../conversation-service
        npm ci
        cd ../media-processing-service
        npm ci
        cd ../developer-api-service
        npm ci

    - name: Run linting
      run: |
        npm run lint
        cd client && npm run lint

    - name: Run unit tests
      run: |
        npm test
        node --test quality/tests/ci-scope.test.mjs
        cd client && npm test -- --watchAll=false --passWithNoTests
        cd ../services/user-service && npm test -- --runInBand
        cd ../media-processing-service && npm test -- --runInBand
        cd ../history-analytics-service && npm test
        cd ../conversation-service && npm test
        cd ../comms-service && npm test
        cd ../developer-api-service && npm test

    - name: Build client
      env:
        CI: false
      run: |
        cd client && npm run build
        cd .. && npm run verify:geo

    - name: Verify production homepage and nginx routing
      if: steps.scope.outputs.seo == 'true'
      run: |
        if ! command -v nginx >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
        fi
        cd client
        # Hosted runners already include Chrome and its runtime dependencies.
        # Avoid reinstalling all browser fonts through slow apt mirrors.
        if ! command -v google-chrome >/dev/null; then
          npx playwright install --with-deps chrome
        fi
        npm run test:seo

    - name: Run Python service tests
      run: |
        python -m pip install -r services/workflow-service/requirements.txt -r services/ai-omni-service/requirements.txt pytest pytest-asyncio
        cd services/workflow-service
        python -m pytest tests
        cd ../ai-omni-service
        python -m pytest tests
        cd ../..
        python test_scenario_batch_and_daily_qa.py --scenario all --mock

    - name: Validate integration harness
      if: steps.scope.outputs.integration == 'true'
      run: |
        python -m pip install -r integration_tests/requirements.txt
        python integration_tests/test_runner.py --help
        python -m compileall -q integration_tests

  ui-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: client/package-lock.json
    - name: Install client dependencies
      run: npm ci --legacy-peer-deps --prefix client
    - name: Install browser engines
      run: |
        if ! command -v google-chrome >/dev/null; then
          npm exec --prefix client -- playwright install --with-deps chrome
        fi
        npm exec --prefix client -- playwright install --with-deps webkit
    - name: Run deterministic viewport, theme, locale, accessibility, and WebKit checks
      env:
        FULL_UI_MATRIX: ${{ github.event_name == 'schedule' || inputs.full_ui_matrix == true }}
        UI_TITLE_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_title_filter || '' }}
        PR_CHECK: ${{ github.event_name == 'pull_request' }}
      run: |
        if [ -n "$UI_TITLE_FILTER" ]; then
          npm --prefix client run test:e2e -- --grep "$UI_TITLE_FILTER"
        elif [ "$FULL_UI_MATRIX" = "true" ]; then
          npm --prefix client run test:e2e
        elif [ "$PR_CHECK" = "true" ]; then
          # Every desktop case plus critical mobile WebKit flows. The complete
          # viewport/theme matrix remains scheduled and manually available.
          npm --prefix client run test:e2e -- --project=chromium-desktop --project=webkit-mobile
        else
          # All cases on narrow/mobile-dark/desktop; critical cases on WebKit.
          npm --prefix client run test:e2e -- \
            --project=chromium-320 \
            --project=chromium-desktop \
            --project=chromium-390-dark-en \
            --project=webkit-mobile
        fi
    - name: Upload UI evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-audit-evidence
        path: |
          quality/artifacts/ui-candidates
          quality/artifacts/playwright-report
          quality/artifacts/playwright-results.json
