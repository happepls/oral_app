name: SDLC Governance

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail instead of report (enable only after shadow acceptance)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sdlc-governance-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdlc-artifacts:
    name: sdlc-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate artifact schema and chain
        id: gate
        continue-on-error: true
        run: python3 scripts/sdlc.py validate --history
      - name: Apply shadow or enforcement result
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          REQUEST_ENFORCEMENT: ${{ inputs.enforce || 'false' }}
        run: |
          mode=$(awk '/^mode:/ {print $2}' bands.yaml)
          echo "artifact gate outcome=$OUTCOME mode=$mode"
          if [ "$OUTCOME" != success ] && { [ "$mode" = enforce ] || [ "$REQUEST_ENFORCEMENT" = true ]; }; then
            exit 1
          fi

  sdlc-review:
    name: sdlc-review
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate evidence for the current PR diff
        id: review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ -z "$PR_NUMBER" ] || [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo 'ERROR: pull request event is missing its number, Base or Head'
              exit 1
            fi
            pr_json=$(mktemp)
            trap 'rm -f "$pr_json"' EXIT
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_json"
            python3 scripts/sdlc-review.py --pull-request "$pr_json" --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/sdlc-review.py --base "$(git rev-parse HEAD^)" --head "$(git rev-parse HEAD)"
          fi
      - name: Apply shadow or enforcement result
        env:
          OUTCOME: ${{ steps.review.outcome }}
          REQUEST_ENFORCEMENT: ${{ inputs.enforce || 'false' }}
        run: |
          mode=$(awk '/^mode:/ {print $2}' bands.yaml)
          echo "review gate outcome=$OUTCOME mode=$mode"
          if [ "$OUTCOME" != success ] && { [ "$mode" = enforce ] || [ "$REQUEST_ENFORCEMENT" = true ]; }; then
            exit 1
          fi
