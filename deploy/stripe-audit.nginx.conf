server {
    listen 80;
    server_name billing-audit.localhost;
    root /usr/share/nginx/html;
    # No production upstreams or application session identifiers in access logs.
    access_log off;
    location /api/users/ { proxy_pass http://user-service:3000; }
    location /api/stripe/ { proxy_pass http://user-service:3000; }
    location /api/v1/ {
        rewrite ^/api/(v1/.*)$ /$1 break;
        proxy_pass http://developer-api-service:3010;
    }
    # AI HTTP requests use the authenticated /api/v1/ facade above.
    # History, business WebSockets, and legacy API routes remain unavailable.
    location /api/ { return 503; }
    location / { try_files $uri $uri/ /index.html; }
}
