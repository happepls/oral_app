
# Local development/integration stack only.
# Zeabur production does not consume this file: each Git-backed service is
# built independently from its configured Root Directory and Dockerfile.

services:
  api-gateway:
    build:
      context: ./api-gateway
    container_name: oral_app_api_gateway
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client-app
      - user-service
      - comms-service
      - ai-omni-service
      - conversation-service
      - history-analytics-service
      - developer-api-service
    networks:
      - oral_app_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  history-analytics-service:
    build: ./services/history-analytics-service
    container_name: oral_app_history_analytics_service
    restart: always
    ports:
      - "3004:3004"
    volumes:
      - ./services/history-analytics-service/src:/app/src
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://root:password@mongo:27017/oral_app_history?authSource=admin
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
    env_file:
      - ./services/history-analytics-service/.env
    depends_on:
      - mongo
    networks:
      - oral_app_net

  client-app:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=/api
        - REACT_APP_API_GATEWAY=http://oral_app_api_gateway:80
        - REACT_APP_GOOGLE_CLIENT_ID=318339571759-ojcd3oamef8ohmu5g04luaoq2a8oiseu.apps.googleusercontent.com
    container_name: oral_app_client_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - REACT_APP_API_URL=/api
      - REACT_APP_API_GATEWAY=http://oral_app_api_gateway:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oral_app_net

  postgres:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=oral_app
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    env_file:
      - ./.env
    volumes:
      - ./services/user-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oral_app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d oral_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:6.0
    container_name: oral_app_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - oral_app_net

  redis:
    image: redis:7-alpine
    container_name: oral_app_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - oral_app_net

  user-service:
    build: ./services/user-service
    container_name: oral_app_user_service
    restart: always
    ports:
      - "3002:3000"
    volumes:
      - ./services/user-service/src:/usr/src/app/src
      - ./services/user-service/node_modules:/usr/src/app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_DATABASE=oral_app
      - DB_PORT=5432
      - DATABASE_URL=postgresql://user:password@postgres:5432/oral_app
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
      - HISTORY_ANALYTICS_SERVICE_URL=http://history-analytics-service:3004
      - CONVERSATION_SERVICE_URL=http://conversation-service:8083
      # Stripe keys come from ./services/user-service/.env (env_file) to avoid
      # empty host-shell vars overriding them. Do NOT re-add ${STRIPE_*:-} here.
      - HTTPS_PROXY=http://host.docker.internal:7890
      - HTTP_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,redis,mongo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./.env
      - ./services/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oral_app_net

  developer-api-service:
    build: ./services/developer-api-service
    container_name: oral_app_developer_api_service
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - DATABASE_URL=postgresql://user:password@postgres:5432/oral_app
      - DELEGATED_JWT_SECRET=${DELEGATED_JWT_SECRET:?Set DELEGATED_JWT_SECRET in the root .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
      - AI_UPSTREAM_TIMEOUT_MS=60000
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - oral_app_net

  comms-service:
    build: ./services/comms-service
    container_name: oral_app_comms_service
    restart: always
    ports:
      - "3001:8080"
    volumes:
      - ./services/comms-service/src:/usr/src/app/src
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
      - AI_SERVICE_WS_URL=ws://ai-omni-service:8082/stream
    env_file:
      - ./services/comms-service/.env
    depends_on:
      - redis
    networks:
      - oral_app_net

  ai-omni-service:
    build: ./services/ai-omni-service
    container_name: oral_app_ai_omni_service
    restart: always
    ports:
      - "8082:8082"
    volumes:
      - ./services/ai-omni-service/models:/usr/src/app/models
      - ./services/ai-omni-service/app:/app/app
    env_file:
      - ./services/ai-omni-service/.env
    environment:
      # Keep the local DashScope credential sourced from the root .env.  The
      # service-specific .env also contains runtime settings, but its copied
      # credential can become stale and cause /generate-scenarios to return 401.
      - QWEN3_OMNI_API_KEY=${QWEN3_OMNI_API_KEY:?Set QWEN3_OMNI_API_KEY in the root .env}
      # Dedicated realtime/HTTP endpoint and credential come from the
      # service-specific env_file. Do not shadow them with public defaults.
      - DASHSCOPE_CHAT_BASE=https://dashscope.aliyuncs.com
      - DASHSCOPE_IMAGE_BASE=https://dashscope.aliyuncs.com
      - QWEN3_OMNI_MODEL=qwen3.5-omni-flash-realtime
      - USER_SERVICE_URL=http://user-service:3000
      - CONVERSATION_SERVICE_URL=http://conversation-service:8083
      - MEDIA_SERVICE_URL=http://media-processing-service:3005
      - WORKFLOW_SERVICE_URL=http://workflow-service:3006
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
      - ENABLE_MAGIC_PASSCODE=true
      # Local development reaches DashScope through the host proxy. Keep all
      # service-to-service traffic on the Docker network instead of proxying it.
      - HTTPS_PROXY=http://host.docker.internal:7890
      - HTTP_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,user-service,conversation-service,media-processing-service,workflow-service,redis,postgres,mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - oral_app_net

  conversation-service:
    build: ./services/conversation-service
    container_name: oral_app_conversation_service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_DATABASE=oral_app
      - DB_PORT=5432
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
    env_file:
      - ./.env
      - ./services/conversation-service/.env
    depends_on:
      - redis
      - postgres
    networks:
      - oral_app_net

  media-processing-service:
    build: ./services/media-processing-service
    container_name: oral_app_media_processing_service
    restart: always
    ports:
      - "3005:3005"
    volumes:
      - ./services/media-processing-service/src:/app/src
      - ./services/media-processing-service/.env:/app/.env
    env_file:
      - ./services/media-processing-service/.env
    environment:
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
    networks:
      - oral_app_net

  workflow-service:
    build: ./services/workflow-service
    container_name: oral_app_workflow_service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=oral_app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - BATCH_EVAL_MODEL=qwen-turbo
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?Set INTERNAL_AUTH_SECRET in the root .env}
    env_file:
      - ./.env
      - ./services/ai-omni-service/.env
    depends_on:
      - postgres
      - redis
    networks:
      - oral_app_net

  backup-service:
    build: ./services/backup-service
    container_name: oral_app_backup_service
    restart: unless-stopped
    env_file:
      # Local credentials stay in this ignored file; production should inject
      # dedicated COS_SECRET_* credentials scoped to the backup bucket.
      - ./services/media-processing-service/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=oral_app
      - POSTGRES_USER=user
      - PGPASSWORD=password
      - MONGO_URI=mongodb://root:password@mongo:27017/oral_app_history?authSource=admin
      - BACKUP_COS_BUCKET=${BACKUP_COS_BUCKET:-oral-backup-1317719935}
      - BACKUP_COS_REGION=${BACKUP_COS_REGION:-ap-shanghai}
      - BACKUP_COS_PREFIX=${BACKUP_COS_PREFIX:-backups/oral-app}
      - COS_SESSION_TOKEN=${COS_SESSION_TOKEN:-}
      - BACKUP_ALERT_WEBHOOK=${BACKUP_ALERT_WEBHOOK:-}
    volumes:
      - backup_status:/var/lib/oral-backup
    depends_on:
      - postgres
      - mongo
    healthcheck:
      test: ["CMD", "/opt/oral-backup/health.sh"]
      interval: 1h
      timeout: 30s
      retries: 1
      start_period: 27h
    networks:
      - oral_app_net

volumes:
  postgres_data:
  mongo_data:
  backup_status:

networks:
  oral_app_net:
    driver: bridge
