# Production Docker Compose Configuration
# This file defines the production deployment configuration

version: '3.8'

services:
  api-gateway:
    image: ghcr.io/sjx1943/oral_app/api-gateway:latest
    container_name: oral_app_api_gateway_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - client-app
      - user-service
      - comms-service
      - ai-omni-service
      - conversation-service
      - history-analytics-service
      - developer-api-service
      - workflow-service
    networks:
      - oral_app_net
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  history-analytics-service:
    image: ghcr.io/sjx1943/oral_app/history-analytics-service:latest
    container_name: oral_app_history_analytics_service_prod
    restart: always
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://root:${MONGO_PASSWORD}@mongo:27017/oral_app_history?authSource=admin
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
    depends_on:
      - mongo
    networks:
      - oral_app_net

  developer-api-service:
    image: ghcr.io/sjx1943/oral_app/developer-api-service:latest
    container_name: oral_app_developer_api_service_prod
    restart: unless-stopped
    environment:
      - PORT=3010
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD}@postgres:5432/oral_app
      - DELEGATED_JWT_SECRET=${DELEGATED_JWT_SECRET:?DELEGATED_JWT_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      - AI_UPSTREAM_TIMEOUT_MS=60000
      - NODE_ENV=production
    depends_on:
      - postgres
      - user-service
    networks:
      - oral_app_net

  client-app:
    image: ghcr.io/sjx1943/oral_app/client:latest
    container_name: oral_app_client_app_prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - REACT_APP_API_URL=/api
      - NODE_ENV=production
    networks:
      - oral_app_net

  postgres:
    image: postgres:14-alpine
    container_name: oral_app_postgres_prod
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=oral_app
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS="--encoding=UTF-8"
    volumes:
      - ./services/user-service/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - oral_app_net
    command: -c shared_buffers=256MB -c max_connections=200

  mongo:
    image: mongo:6.0
    container_name: oral_app_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - oral_app_net

  redis:
    image: redis:7-alpine
    container_name: oral_app_redis_prod
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - oral_app_net

  user-service:
    image: ghcr.io/sjx1943/oral_app/user-service:latest
    container_name: oral_app_user_service_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=oral_app
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      - HISTORY_ANALYTICS_SERVICE_URL=http://history-analytics-service:3004
      - CONVERSATION_SERVICE_URL=http://conversation-service:8083
      - NODE_ENV=production
      - DATABASE_SSL=false
    depends_on:
      - postgres
    networks:
      - oral_app_net

  comms-service:
    image: ghcr.io/sjx1943/oral_app/comms-service:latest
    container_name: oral_app_comms_service_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_WS_URL=ws://ai-omni-service:8082/stream
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - oral_app_net

  ai-omni-service:
    image: ghcr.io/sjx1943/oral_app/ai-omni-service:latest
    container_name: oral_app_ai_omni_service_prod
    restart: always
    ports:
      - "8082:8082"
      - "8081:8081"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      - DASHSCOPE_WS_URL=${DASHSCOPE_WS_URL:?DASHSCOPE_WS_URL is required}
      - DASHSCOPE_HTTP_BASE=${DASHSCOPE_HTTP_BASE:?DASHSCOPE_HTTP_BASE is required}
      - QWEN3_OMNI_MODEL=qwen3.5-omni-flash-realtime
      - USER_SERVICE_URL=http://user-service:3000
      - CONVERSATION_SERVICE_URL=http://conversation-service:8083
      - MEDIA_SERVICE_URL=http://media-processing-service:3005
      - WORKFLOW_SERVICE_URL=http://workflow-service:3006
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      - ENABLE_MAGIC_PASSCODE=true
      - NODE_ENV=production
    depends_on:
      - workflow-service
    networks:
      - oral_app_net

  conversation-service:
    image: ghcr.io/sjx1943/oral_app/conversation-service:latest
    container_name: oral_app_conversation_service_prod
    restart: always
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_USER=user
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE=oral_app
      - DB_PORT=5432
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NODE_ENV=production
    depends_on:
      - redis
      - postgres
    networks:
      - oral_app_net

  media-processing-service:
    image: ghcr.io/sjx1943/oral_app/media-processing-service:latest
    container_name: oral_app_media_processing_service_prod
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
    networks:
      - oral_app_net

  workflow-service:
    image: ghcr.io/sjx1943/oral_app/workflow-service:latest
    container_name: oral_app_workflow_service_prod
    restart: always
    ports:
      - "3006:3006"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=oral_app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
      - REDIS_DB=0
    depends_on:
      - postgres
      - redis
    networks:
      - oral_app_net

  backup-service:
    image: ghcr.io/sjx1943/oral_app/backup-service:latest
    container_name: oral_app_backup_service_prod
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=oral_app
      - POSTGRES_USER=user
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - MONGO_URI=mongodb://root:${MONGO_PASSWORD}@mongo:27017/oral_app_history?authSource=admin
      - BACKUP_COS_BUCKET=${BACKUP_COS_BUCKET:?BACKUP_COS_BUCKET is required}
      - BACKUP_COS_REGION=${BACKUP_COS_REGION:?BACKUP_COS_REGION is required}
      - BACKUP_COS_PREFIX=${BACKUP_COS_PREFIX:-backups/oral-app}
      - COS_SECRET_ID=${COS_SECRET_ID:?COS_SECRET_ID is required}
      - COS_SECRET_KEY=${COS_SECRET_KEY:?COS_SECRET_KEY is required}
      - COS_SESSION_TOKEN=${COS_SESSION_TOKEN:-}
      - BACKUP_ALERT_WEBHOOK=${BACKUP_ALERT_WEBHOOK:-}
      - BACKUP_STATUS_FILE=/var/lib/oral-backup/status.json
    volumes:
      - backup_status_prod:/var/lib/oral-backup
    depends_on:
      - postgres
      - mongo
    healthcheck:
      test: ["CMD", "/opt/oral-backup/health.sh"]
      interval: 1h
      timeout: 30s
      retries: 1
      start_period: 27h
    networks:
      - oral_app_net

volumes:
  postgres_data_prod:
  mongo_data_prod:
  backup_status_prod:

networks:
  oral_app_net:
    driver: bridge
